<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deriv Bot - Teste de Conexão</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-4">
    <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4">
      <h1 class="text-2xl font-bold text-cyan-400">Deriv Bot - Teste de Conexão</h1>
      <p class="text-slate-400 text-sm">Primeiro vamos validar a conexão real com a Deriv.</p>
    </header>

    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-slate-300 mb-1">API Token da Deriv</label>
          <input
            id="token"
            type="password"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3"
            placeholder="Cole seu token aqui"
          />
          <p class="text-xs text-slate-500 mt-1">
            O token não será salvo no GitHub. Ele só é usado na sua sessão.
          </p>
        </div>

        <div>
          <label class="block text-sm text-slate-300 mb-1">Ativo</label>
          <select id="symbol" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3">
            <option value="R_100">Volatility 100 Index</option>
            <option value="R_50">Volatility 50 Index</option>
            <option value="1HZ100V">Volatility 100 (1s) Index</option>
          </select>
        </div>
      </div>

      <div class="flex flex-wrap gap-2 mt-4">
        <button id="btn-connect" class="px-4 py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 font-semibold">
          Conectar
        </button>
        <button id="btn-disconnect" class="px-4 py-3 rounded-xl bg-rose-700 hover:bg-rose-600 font-semibold" disabled>
          Desconectar
        </button>
      </div>
    </section>

    <section class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="text-xs text-slate-400">Status</div>
        <div id="status" class="font-bold text-red-400">DESCONECTADO</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="text-xs text-slate-400">Conta</div>
        <div id="loginid" class="font-bold">-</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="text-xs text-slate-400">Tipo</div>
        <div id="account-type" class="font-bold">-</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="text-xs text-slate-400">Saldo</div>
        <div id="balance" class="font-bold text-emerald-400">-</div>
      </div>
    </section>

    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4">
      <div class="text-sm text-slate-400 mb-2">Último tick</div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-slate-800 rounded-xl p-4">
          <div class="text-xs text-slate-400">Cotação</div>
          <div id="last-quote" class="font-bold text-lg">-</div>
        </div>
        <div class="bg-slate-800 rounded-xl p-4">
          <div class="text-xs text-slate-400">Último dígito</div>
          <div id="last-digit" class="font-bold text-2xl text-amber-300">-</div>
        </div>
        <div class="bg-slate-800 rounded-xl p-4">
          <div class="text-xs text-slate-400">Ativo atual</div>
          <div id="active-symbol" class="font-bold">-</div>
        </div>
      </div>
    </section>

    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <div class="text-sm text-slate-400 mb-2">Log</div>
      <div id="log-box" class="h-72 overflow-y-auto bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs font-mono space-y-1"></div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
